<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="680" height="450" viewBox="0 0 680 450" role="img">
  <title>Rank emblems — draft v1 (2026-10-14)</title>
  <desc>Approved direction for the 8 rank emblems (spec §6.7): layered shields from Bronze to Challenger, adding wings, gems, crowns and laurels, with a chess piece in the center. Phase 5 refines this with metallic gradients, engraving details and animation.</desc>
  <defs>
    <path id="sh" d="M0,-48 L36,-38 C38,8 22,34 0,50 C-22,34 -38,8 -36,-38 Z"/>
    <path id="wg" d="M30,-30 C50,-42 64,-30 66,-12 C58,-17 51,-15 47,-9 C55,-6 60,2 58,10 C50,3 43,3 36,7 Z"/>
    <polygon id="cw" points="32,-28 68,-44 60,-20 74,-10 54,-4 62,12 36,4"/>
    <path id="cr" d="M-18,-46 L-20,-62 L-9,-54 L0,-70 L9,-54 L20,-62 L18,-46 Z"/>
    <polygon id="gm" points="0,-60 7,-52 0,-44 -7,-52"/>
    <style>
      .piece { font-family: 'Segoe UI Symbol', 'Noto Sans Symbols 2', 'DejaVu Sans', serif; font-size: 34px; text-anchor: middle; }
      .label { font-family: 'Be Vietnam Pro', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #33362e; text-anchor: middle; }
    </style>
  </defs>
  <rect width="680" height="450" fill="#f3f1ea"/>

  <!-- Đồng / Bronze — pawn -->
  <g transform="translate(115,115)">
    <use href="#sh" fill="#7a4a26"/>
    <use href="#sh" fill="#b07444" transform="scale(0.82)"/>
    <use href="#sh" fill="none" stroke="#e0a875" stroke-width="1.5" transform="scale(0.68)"/>
    <text x="0" y="13" class="piece" fill="#3d2412">♟</text>
  </g>
  <text x="115" y="200" class="label">Đồng</text>

  <!-- Bạc / Silver — knight -->
  <g transform="translate(265,115)">
    <use href="#sh" fill="#5f6873"/>
    <use href="#sh" fill="#b9c2cc" transform="scale(0.86)"/>
    <use href="#sh" fill="#dfe5eb" transform="scale(0.72)"/>
    <use href="#sh" fill="none" stroke="#7d8793" stroke-width="1.5" transform="scale(0.6)"/>
    <text x="0" y="13" class="piece" fill="#3a414a">♞</text>
  </g>
  <text x="265" y="200" class="label">Bạc</text>

  <!-- Vàng / Gold — bishop, small wings -->
  <g transform="translate(415,115)">
    <use href="#wg" fill="#d9a93a"/>
    <use href="#wg" fill="#d9a93a" transform="scale(-1,1)"/>
    <use href="#wg" fill="#f3d27a" transform="scale(0.8) translate(6,-2)"/>
    <use href="#wg" fill="#f3d27a" transform="scale(-0.8,0.8) translate(6,-2)"/>
    <use href="#sh" fill="#8a5f12"/>
    <use href="#sh" fill="#e2b245" transform="scale(0.86)"/>
    <use href="#sh" fill="#f7dc8c" transform="scale(0.7)"/>
    <text x="0" y="13" class="piece" fill="#6b4708">♝</text>
  </g>
  <text x="415" y="200" class="label">Vàng</text>

  <!-- Bạch Kim / Platinum — rook, wings + gem -->
  <g transform="translate(565,115)">
    <use href="#wg" fill="#3f8f8b"/>
    <use href="#wg" fill="#3f8f8b" transform="scale(-1,1)"/>
    <use href="#wg" fill="#9fe0d8" transform="scale(0.8) translate(6,-2)"/>
    <use href="#wg" fill="#9fe0d8" transform="scale(-0.8,0.8) translate(6,-2)"/>
    <use href="#sh" fill="#24605d"/>
    <use href="#sh" fill="#6cc3bc" transform="scale(0.86)"/>
    <use href="#sh" fill="#c9efe9" transform="scale(0.7)"/>
    <use href="#gm" fill="#e8fffb" stroke="#24605d" stroke-width="1.5"/>
    <text x="0" y="13" class="piece" fill="#174a47">♜</text>
  </g>
  <text x="565" y="200" class="label">Bạch Kim</text>

  <!-- Kim Cương / Diamond — queen, crystal wings + large gem -->
  <g transform="translate(115,325)">
    <use href="#cw" fill="#2f5fb3"/>
    <use href="#cw" fill="#2f5fb3" transform="scale(-1,1)"/>
    <use href="#cw" fill="#9cc3ff" transform="scale(0.78) translate(8,-2)"/>
    <use href="#cw" fill="#9cc3ff" transform="scale(-0.78,0.78) translate(8,-2)"/>
    <use href="#sh" fill="#1d3f80"/>
    <use href="#sh" fill="#4f86e0" transform="scale(0.86)"/>
    <use href="#sh" fill="#bcd6ff" transform="scale(0.7)"/>
    <polygon points="0,-66 10,-54 0,-42 -10,-54" fill="#e6f0ff" stroke="#1d3f80" stroke-width="1.5"/>
    <text x="0" y="13" class="piece" fill="#163064">♛</text>
  </g>
  <text x="115" y="410" class="label">Kim Cương</text>

  <!-- Tinh Anh / Elite — king, crystal wings + crown + flames -->
  <g transform="translate(265,325)">
    <path d="M-26,-30 C-40,-50 -30,-66 -22,-74 C-20,-60 -12,-56 -10,-44 Z" fill="#c25cf0"/>
    <path d="M26,-30 C40,-50 30,-66 22,-74 C20,-60 12,-56 10,-44 Z" fill="#c25cf0"/>
    <use href="#cw" fill="#5a2ba3"/>
    <use href="#cw" fill="#5a2ba3" transform="scale(-1,1)"/>
    <use href="#cw" fill="#c6a3ff" transform="scale(0.78) translate(8,-2)"/>
    <use href="#cw" fill="#c6a3ff" transform="scale(-0.78,0.78) translate(8,-2)"/>
    <use href="#sh" fill="#3d1a75"/>
    <use href="#sh" fill="#7c4ad6" transform="scale(0.86)"/>
    <use href="#sh" fill="#dccbff" transform="scale(0.7)"/>
    <use href="#cr" fill="#f0c94a" stroke="#7a5a10" stroke-width="1.2"/>
    <text x="0" y="13" class="piece" fill="#2e1260">♚</text>
  </g>
  <text x="265" y="410" class="label">Tinh Anh</text>

  <!-- Cao Thủ / Master — king, phoenix wings + crown, gold trim -->
  <g transform="translate(415,325)">
    <path d="M28,-24 C56,-58 74,-48 74,-22 C68,-30 62,-28 58,-22 C68,-18 72,-8 70,4 C62,-4 54,-4 48,0 C56,4 58,14 54,22 C46,12 38,10 32,12 Z" fill="#d1452f"/>
    <path d="M-28,-24 C-56,-58 -74,-48 -74,-22 C-68,-30 -62,-28 -58,-22 C-68,-18 -72,-8 -70,4 C-62,-4 -54,-4 -48,0 C-56,4 -58,14 -54,22 C-46,12 -38,10 -32,12 Z" fill="#d1452f"/>
    <path d="M30,-20 C50,-44 64,-38 64,-22 C56,-24 50,-18 48,-12 C40,-12 36,-8 34,-4 Z" fill="#ffa040"/>
    <path d="M-30,-20 C-50,-44 -64,-38 -64,-22 C-56,-24 -50,-18 -48,-12 C-40,-12 -36,-8 -34,-4 Z" fill="#ffa040"/>
    <use href="#sh" fill="#6e1414"/>
    <use href="#sh" fill="#c23a3a" transform="scale(0.86)"/>
    <use href="#sh" fill="none" stroke="#f0c94a" stroke-width="2.5" transform="scale(0.76)"/>
    <use href="#sh" fill="#ffd9c9" transform="scale(0.66)"/>
    <use href="#cr" fill="#f0c94a" stroke="#7a5a10" stroke-width="1.2"/>
    <circle cx="0" cy="-56" r="3" fill="#c23a3a"/>
    <text x="0" y="13" class="piece" fill="#5a0d0d" style="font-size:32px">♚</text>
  </g>
  <text x="415" y="410" class="label">Cao Thủ</text>

  <!-- Thách Đấu / Challenger — gold king, gold wings + laurel + jeweled crown + rays -->
  <g transform="translate(565,325)">
    <g stroke="#f0c94a" stroke-width="2" stroke-linecap="round" opacity="0.7">
      <line x1="0" y1="-60" x2="0" y2="-80"/><line x1="40" y1="-44" x2="56" y2="-58"/><line x1="-40" y1="-44" x2="-56" y2="-58"/>
      <line x1="56" y1="-8" x2="74" y2="-12"/><line x1="-56" y1="-8" x2="-74" y2="-12"/>
      <line x1="24" y1="-58" x2="32" y2="-76"/><line x1="-24" y1="-58" x2="-32" y2="-76"/>
    </g>
    <g fill="#3f8a3a">
      <ellipse cx="-34" cy="30" rx="9" ry="4" transform="rotate(-50 -34 30)"/><ellipse cx="-42" cy="16" rx="9" ry="4" transform="rotate(-70 -42 16)"/><ellipse cx="-46" cy="0" rx="9" ry="4" transform="rotate(-85 -46 0)"/><ellipse cx="-24" cy="40" rx="9" ry="4" transform="rotate(-30 -24 40)"/>
      <ellipse cx="34" cy="30" rx="9" ry="4" transform="rotate(50 34 30)"/><ellipse cx="42" cy="16" rx="9" ry="4" transform="rotate(70 42 16)"/><ellipse cx="46" cy="0" rx="9" ry="4" transform="rotate(85 46 0)"/><ellipse cx="24" cy="40" rx="9" ry="4" transform="rotate(30 24 40)"/>
    </g>
    <use href="#wg" fill="#f0c94a" transform="translate(4,-6)"/>
    <use href="#wg" fill="#f0c94a" transform="scale(-1,1) translate(4,-6)"/>
    <use href="#sh" fill="#1a2550"/>
    <use href="#sh" fill="#f0c94a" transform="scale(0.88)"/>
    <use href="#sh" fill="#24306a" transform="scale(0.78)"/>
    <use href="#sh" fill="none" stroke="#f7e08a" stroke-width="1.2" transform="scale(0.66)"/>
    <path d="M-22,-46 L-24,-66 L-11,-56 L0,-76 L11,-56 L24,-66 L22,-46 Z" fill="#ffd84a" stroke="#8a6410" stroke-width="1.2"/>
    <circle cx="0" cy="-58" r="3.5" fill="#e0413a"/><circle cx="-12" cy="-52" r="2.5" fill="#3a7be0"/><circle cx="12" cy="-52" r="2.5" fill="#3a7be0"/>
    <text x="0" y="13" class="piece" fill="#ffd84a">♚</text>
  </g>
  <text x="565" y="410" class="label">Thách Đấu</text>
</svg>
