name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Blocking checks (docs/PLAN.md → Definition of Done)
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run check-i18n
      - run: npm run build
      # Size-limit / Lighthouse CI are added later in warn-only mode (spec §13.1).

  e2e:
    # Warn-only until the suite is stable (docs/PLAN.md → Definition of Done).
    runs-on: ubuntu-latest
    needs: check
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
